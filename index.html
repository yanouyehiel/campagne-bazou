<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campagne de prédication à NDOM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <p class="logo">NDOM</p>
        <div class="content">
            <p>Cooming Soon</p>
            <h1>Campagne de prédication à <span>NDOM</span></h1>
            <h3>20 Décembre 2025 à 22h00</h3>
            <div class="launch-time">
                <div>
                    <p id="days">00</p>
                    <span>Jours</span>
                </div>
                <div>
                    <p id="hours">00</p>
                    <span>Heures</span>
                </div>
                <div>
                    <p id="minutes">00</p>
                    <span>Minutes</span>
                </div>
                <div>
                    <p id="seconds">00</p>
                    <span>Secondes</span>
                </div>
            </div>
            <button type="button">Voir plus <img src="triangle.png"></button>
        </div>
        <img src="rocket.png" alt="rocket" class="rocket">
    </div>
    <script>
        var countDownDate = new Date("Dec 20, 2025 22:00:00").getTime()
        var x = setInterval(() => {
            var now = new Date().getTime()
            var distance = countDownDate - now

            var days = Math.floor(distance / (1000 * 60 * 60 * 24))
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))
            var seconds = Math.floor((distance % (1000 * 60)) / 1000)

            document.getElementById("days").innerHTML = days
            document.getElementById("hours").innerHTML = hours
            document.getElementById("minutes").innerHTML = minutes
            document.getElementById("seconds").innerHTML = seconds

            if (distance < 0) {
                clearInterval(x)
                document.getElementById("days").innerHTML = "0"
                document.getElementById("hours").innerHTML = "0"
                document.getElementById("minutes").innerHTML = "0"
                document.getElementById("seconds").innerHTML = "0"
            }
        }, 1000);
    </script>
</body>
</html>
